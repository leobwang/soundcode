[project]
name = "soundcode"
version = "0.1.0"
description = "LSP-guided speculative decoding with semantic rollback for code generation"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "httpx>=0.28.1",
    "lsp-client>=0.3.9",
    "vllm>=0.20.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soundcode*"]

